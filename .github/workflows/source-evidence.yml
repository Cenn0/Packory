name: Source qualification evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Exact source evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity and public privacy
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/check_public_privacy.py
      - name: Archive tracked source without Git identities or runtime data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packory-source-evidence"
          git archive --format=tar --prefix=Packory/ HEAD | gzip -n > "$RUNNER_TEMP/packory-source-evidence/source.tar.gz"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'packory-source-evidence'
          archive = root / 'source.tar.gz'
          document = {
              'schema': 'packory.source-evidence/1',
              'sourceSha': os.environ['SOURCE_SHA'],
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'qualification': 'source-only',
              'productionRecommended': False,
              'archive': {'name': archive.name, 'sha256': hashlib.sha256(archive.read_bytes()).hexdigest(), 'bytes': archive.stat().st_size},
          }
          (root / 'manifest.json').write_text(json.dumps(document, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify generated source archive digest and narrow qualification claim
        run: python3 scripts/verify_source_evidence.py --evidence-dir "$RUNNER_TEMP/packory-source-evidence" --expected-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-evidence-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packory-source-evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
