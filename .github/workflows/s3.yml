name: S3 object storage
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s3:
    name: S3 backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PACKORY_TEST_S3: http://127.0.0.1:5000
      PACKORY_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=packory;Username=packory;Password=test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: packory
          POSTGRES_PASSWORD: test
          POSTGRES_DB: packory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packory -d packory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install local open-source S3 emulator
        run: python -m pip install 'moto[server]==5.2.3'
      - name: Start emulator
        run: |
          moto_server -H 127.0.0.1 -p 5000 >/tmp/packory-moto.log 2>&1 &
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5000/ >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/packory-moto.log
          exit 1
      - name: Test offline snapshot S3 object-version inventory against Moto (not real-provider evidence)
        run: python3 -m unittest discover -s tests -p test_pg_s3_snapshot_s3.py -v
      # ubuntu-latest currently exposes PG18 utilities, which emit
      # transaction_timeout unsupported by the PostgreSQL 16 service.
      # Use the same major from an isolated postgres:16 client container;
      # no host APT repository or privileged installation is required.
      - name: Pin PostgreSQL client to the PostgreSQL 16 service major
        run: |
          mkdir -p "$RUNNER_TEMP/pg16-client"
          for command in pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/pg16-client/$command" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          tool="$(basename "$0")"
          exec docker run --rm --network host --user "$(id -u):$(id -g)" \
            --mount type=bind,source=/tmp,target=/tmp \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \
            postgres:16 "$tool" "$@"
          SH
            chmod 755 "$RUNNER_TEMP/pg16-client/$command"
          done
          echo "$RUNNER_TEMP/pg16-client" >> "$GITHUB_PATH"
      - name: Install offline integration dependencies (PostgreSQL 16 client/server)
        run: |
          pg_dump --version
          pg_restore --version
          test "$(pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "16"
          python3 -m pip install 'boto3>=1.35,<2' 'psycopg[binary]>=3,<4'
      - name: Test coordinated PostgreSQL and versioned Moto S3 snapshot and isolated restore (emulator only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: packory
          PGPASSWORD: test
          PGDATABASE: packory
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: python3 -m unittest discover -s tests -p test_pg_s3_restore_e2e.py -v
      - name: Test real AWS S3 client requests
        run: dotnet test tests/Packory.Tests/Packory.Tests.csproj -c Release --filter FullyQualifiedName~S3ProviderTests
      - name: Test PostgreSQL-S3 publication recovery and exclusive writer lease
        run: dotnet test tests/Packory.Tests/Packory.Tests.csproj -c Release --filter FullyQualifiedName~PostgresS3RecoveryTests
      - name: Test private feed bundles with PostgreSQL and S3 including cold reads and corruption
        run: dotnet test tests/Packory.Tests/Packory.Tests.csproj -c Release --filter FullyQualifiedName~FeedProviderRecoveryTests
      - name: Verify native private feeds with PostgreSQL and S3 (emulator only)
        run: python3 scripts/smoke-feed-providers.py
