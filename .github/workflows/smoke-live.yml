name: Live registry mirror smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 0'
permissions:
  contents: read
jobs:
  restore-from-nuget-org-through-packory:
    name: Real NuGet restore via Packory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Publish and serve Packory
        run: |
          dotnet publish src/Packory/Packory.csproj -c Release -o /tmp/packory-server
          mkdir -p /tmp/packory-data
          PACKORY_DATA_DIRECTORY=/tmp/packory-data PACKORY_PUBLIC_BASE_URL=http://localhost:8080 \
            ASPNETCORE_URLS=http://127.0.0.1:8080 dotnet /tmp/packory-server/Packory.dll >/tmp/packory.log 2>&1 &
          echo $! > /tmp/packory.pid
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8080/health/ready && exit 0; sleep 1; done
          cat /tmp/packory.log
          exit 1
      - name: Restore a real package without fallback source
        run: bash scripts/smoke-nuget.sh
      - name: Install a real npm package through Packory
        run: PACKORY_PUBLIC_BASE_URL=http://localhost:8080 bash scripts/smoke-npm.sh
      - name: Stop service
        if: always()
        run: |
          if test -f /tmp/packory.pid; then kill "$(cat /tmp/packory.pid)" || true; fi
