name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    name: Public source and Git identity privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test privacy scanner
        run: python3 -m unittest discover -s tests -p test_public_privacy.py -v
      - name: Check tracked source and checked-out commit identity
        run: python3 scripts/check_public_privacy.py
  test:
    name: Build and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Packory.slnx
      - name: Build (warnings are errors)
        run: dotnet build Packory.slnx --configuration Release --no-restore -warnaserror
      - name: Test all protocol adapters
        run: dotnet test Packory.slnx --configuration Release --no-build --logger 'console;verbosity=normal'
      - name: Validate OCI process-recovery harness safety
        run: python3 -m unittest discover -s tests -p test_oci_recovery_harness.py -v
      - name: Verify OCI upload recovery after actual SIGKILL and TCP disconnect
        run: python3 scripts/smoke_oci_recovery.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate offline backup and restore tooling
        run: |
          python3 -m unittest discover -s tests -p test_client_environment.py -v
          python3 -m unittest discover -s tests -p test_qualification_gate.py -v
          python3 -m unittest discover -s tests -p test_offline_backup.py -v
          python3 -m unittest discover -s tests -p test_maven_snapshot.py -v
          python3 -m unittest discover -s tests -p test_maven_bootstrap.py -v
      - name: Verify fail-closed signed production release evidence checks (synthetic fixtures)
        run: python3 -m unittest discover -s tests -p test_release_evidence.py -v
      - name: Validate source evidence integrity verifier (synthetic only)
        run: python3 -m unittest discover -s tests -p test_source_evidence.py -v
      - name: Validate main image publish workflow gating (static regression)
        run: |
          python3 -m unittest discover -s tests -p test_container_publish_contract.py -v
          python3 -m unittest discover -s tests -p test_container_delivery.py -v
      - name: Validate S3 real-provider probe failure detection (synthetic only)
        run: python3 -m unittest discover -s tests -p test_s3_provider_probe.py -v
      - name: Validate PostgreSQL/S3 offline snapshot integrity logic (synthetic only)
        run: |
          python3 -m unittest discover -s tests -p test_pg_s3_snapshot.py -v
          python3 -m unittest discover -s tests -p test_pg_s3_snapshot_safety.py -v
          python3 -m unittest discover -s tests -p test_pg_s3_snapshot_feeds.py -v
      - name: Validate offline NVIDIA SkillSpector scan bridge
        run: |
          python3 -m py_compile workers/skillspector/worker.py
          python3 -m unittest discover -s tests -p test_skillspector_bridge.py -v
      - name: Validate optional AI bridge (offline synthetic tests)
        run: |
          python3 -m py_compile workers/skillspector/ai_worker.py
          python3 -m unittest discover -s tests -p test_skill_ai_worker.py -v
      - name: Validate scanner Compose configuration
        run: |
          docker compose config --quiet
          PACKORY_SKILL_AI_ENDPOINTS_PATH=/tmp/packory-ai-endpoints-placeholder.json \
          PACKORY_SKILL_AI_KEYRING_PATH=/tmp/packory-ai-keyring-placeholder.json \
          docker compose -f compose.yaml -f compose.skill-ai.yaml config --quiet
      - name: Validate private ingress profile and proxy authorization boundaries
        run: python3 -m unittest discover -s tests -p test_proxy_profile.py -v
      - name: Validate dashboard JavaScript
        run: node --check src/Packory/wwwroot/app.js
      - name: Verify dashboard ecosystem parity with implemented catalog
        run: python3 -m unittest discover -s tests -p test_dashboard_contract.py -v
      - name: Reject stale registry capabilities and protocol documentation
        run: python3 -m unittest discover -s tests -p test_capability_consistency.py -v
      - name: Validate shell smoke scripts
        run: bash -n scripts/smoke-nuget.sh scripts/smoke-npm.sh scripts/smoke-hosted.sh scripts/smoke-ecosystems.sh scripts/smoke-oci-docker.sh scripts/smoke-oci-helm.sh scripts/smoke-raw.sh scripts/smoke-maven.sh scripts/smoke-maven-deploy.sh scripts/smoke-go.sh scripts/smoke-feed-nuget.sh scripts/smoke-feed-raw.sh scripts/smoke-feed-maven.sh scripts/smoke-feed-go.sh scripts/smoke-feed-npm.sh scripts/smoke-feed-ecosystems.sh scripts/smoke-feed-oci.sh
      - name: Exercise real hosted NuGet and npm clients
        run: bash scripts/smoke-hosted.sh
      - name: Record allowlisted client and runner versions
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/client_environment.py --sha "$SOURCE_SHA" --output "$RUNNER_TEMP/client-environment.json"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: client-environment-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/client-environment.json
          if-no-files-found: error
          retention-days: 7
      - name: Exercise real private multi-feed NuGet publish and restore
        run: bash scripts/smoke-feed-nuget.sh
      - name: Exercise real hosted Cargo and pip clients
        run: bash scripts/smoke-ecosystems.sh
      - name: Exercise real hosted OCI registry with Docker
        run: bash scripts/smoke-oci-docker.sh
      - name: Exercise native Maven release consumer against Packory hosted files
        run: bash scripts/smoke-maven.sh
      - name: Exercise real Go CLI publish, download, build, verify and restart
        run: bash scripts/smoke-go.sh
      - name: Exercise immutable Raw publish/download against running Packory
        run: bash scripts/smoke-raw.sh
      - name: Exercise isolated private Raw hosted feeds with real HTTP client
        run: bash scripts/smoke-feed-raw.sh
      - name: Exercise isolated private Maven feeds with native Maven 3
        run: bash scripts/smoke-feed-maven.sh
      - name: Exercise isolated private Go feeds with native Go CLI
        run: bash scripts/smoke-feed-go.sh
      - name: Exercise isolated npm feeds with publish, install and fresh-cache ci
        run: bash scripts/smoke-feed-npm.sh
      - name: Exercise isolated Cargo and PyPI feeds with native publishers and consumers
        run: bash scripts/smoke-feed-ecosystems.sh
      - name: Verify offline restore across all eight private package kinds
        run: python3 scripts/smoke-feed-recovery.py
      - name: Exercise isolated OCI feeds with pinned Helm push, pull and restart
        run: bash scripts/smoke-feed-oci.sh
      - name: Exercise real Helm OCI chart push and pull with pinned Helm 3
        run: bash scripts/smoke-oci-helm.sh
      - name: Exercise Docker with anonymous generic reads and forced OCI authenticated ping
        run: PACKORY_SMOKE_ANONYMOUS_READ=true PACKORY_SMOKE_AUTHENTICATED_PING=true bash scripts/smoke-oci-docker.sh
  maven:
    name: Native Maven deploy and Gradle dependency acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build native acceptance host
        run: dotnet build src/Packory/Packory.csproj --configuration Release -warnaserror
      - name: Verify native release and SNAPSHOT publishing, isolation and restart
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash scripts/smoke-maven-deploy.sh
  dashboard:
    name: MCP dashboard browser regressions
    runs-on: ubuntu-latest
    # Playwright --with-deps installs OS packages and a pinned browser from scratch;
    # the previous ten-minute limit canceled installation before UI tests could run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pinned browser test tooling
        run: npm install --prefix "$RUNNER_TEMP/packory-dashboard-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Install Chromium headless shell
        run: '"$RUNNER_TEMP/packory-dashboard-tools/node_modules/.bin/playwright" install --with-deps chromium --only-shell'
      - name: Verify real dashboard assets with synthetic API responses
        env:
          NODE_PATH: ${{ runner.temp }}/packory-dashboard-tools/node_modules
        run: node scripts/test-mcp-dashboard.cjs
  container:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate prebuilt-image Compose deployment
        run: docker compose -f compose.ghcr.yaml config --quiet
      - name: Build self-hosted image
        run: docker build -t packory:ci .
  qualification:
    name: Complete qualification
    needs: [privacy, test, maven, dashboard, container]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require all local CI jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; jobs=json.loads(os.environ["NEEDS_JSON"]); assert len(jobs)==5 and all(j["result"]=="success" for j in jobs.values()), "Required CI job did not pass"'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact-commit provider and interoperability workflows
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_EVENT: ${{ github.event_name == 'pull_request' && 'pull_request' || 'push' }}
        run: >-
          python3 scripts/qualification_gate.py --sha "$SOURCE_SHA"
          --event "$SOURCE_EVENT" --wait-seconds 1800
          --output "$RUNNER_TEMP/ci-qualification.json"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ci-qualification-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-qualification.json
          if-no-files-found: error
          retention-days: 7
