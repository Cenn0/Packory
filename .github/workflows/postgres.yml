name: PostgreSQL backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: packory_test
          POSTGRES_PASSWORD: packory_test_only
          POSTGRES_DB: packory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packory_test -d packory_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PACKORY_TEST_POSTGRES: "Host=localhost;Port=5432;Database=packory_test;Username=packory_test;Password=packory_test_only;Pooling=false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # PostgreSQL-specific facts also live in schema and MCP catalog classes.
      # A class-name filter must not silently omit those provider regressions.
      - name: Run the full suite with PostgreSQL provider checks enabled
        run: dotnet test tests/Packory.Tests/Packory.Tests.csproj -c Release --logger 'console;verbosity=normal'
