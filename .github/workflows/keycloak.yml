name: Keycloak OIDC end-to-end
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keycloak:
    name: Real signed Keycloak JWT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore and build
        run: |
          dotnet restore Packory.slnx
          dotnet build Packory.slnx -c Release --no-restore -warnaserror
      - name: Validate shell test script
        run: bash -n scripts/smoke-oidc-keycloak.sh
      - name: Real Keycloak OIDC issuer, audience and authorization
        run: bash scripts/smoke-oidc-keycloak.sh
