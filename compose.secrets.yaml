# File-backed credentials for single-node loopback evaluation.
# All three *_SOURCE variables must point to existing operator-owned HOST files.
# Do not commit source files or add plaintext secrets to Compose environment.
services:
  packory:
    image: ghcr.io/cenn0/packory:${PACKORY_IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PACKORY_DATA_DIRECTORY: /data
      PACKORY_PUBLIC_BASE_URL: ${PACKORY_PUBLIC_BASE_URL:-http://localhost:8080}
      PACKORY_ANONYMOUS_READ: "false"
      PACKORY_SKILL_SECURITY_ENFORCED: "true"
      PACKORY_MCP_ENABLED: "true"
      PACKORY_ADMIN_TOKEN_FILE: /run/secrets/packory_admin_token
      PACKORY_READ_TOKEN_FILE: /run/secrets/packory_read_token
      PACKORY_WRITE_TOKEN_FILE: /run/secrets/packory_write_token
    secrets:
      - packory_admin_token
      - packory_read_token
      - packory_write_token
    volumes:
      - packory-data:/data
      - skill-scans-in:/data/skill-scans/in
      - skill-scans-out:/data/skill-scans/out
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  skillspector:
    image: ghcr.io/cenn0/packory-skillspector:${PACKORY_IMAGE_TAG:-main}
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: "1654:1654"
    volumes:
      - skill-scans-in:/work/in:ro
      - skill-scans-out:/work/out
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0

secrets:
  packory_admin_token:
    file: ${PACKORY_ADMIN_TOKEN_SOURCE:?Set PACKORY_ADMIN_TOKEN_SOURCE to an absolute host file path}
  packory_read_token:
    file: ${PACKORY_READ_TOKEN_SOURCE:?Set PACKORY_READ_TOKEN_SOURCE to an absolute host file path}
  packory_write_token:
    file: ${PACKORY_WRITE_TOKEN_SOURCE:?Set PACKORY_WRITE_TOKEN_SOURCE to an absolute host file path}

volumes:
  packory-data:
  skill-scans-in:
  skill-scans-out:
